<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Top Professional">
  <!-- The masthead's one distinctive device is the slanted red block carrying
       a white TOP. At 16px three letters are mud, so the mark keeps the block
       and the slant and carries a single T. Full bleed rather than a tile on
       cream: a cream ground disappears into a light tab strip, and the deep
       red holds against both light and dark chrome. -->
  <rect width="32" height="32" fill="#A3070B"/>
  <g fill="#FFFFFF" transform="translate(16 16) skewX(-12) translate(-16 -16)">
    <rect x="6.6" y="7" width="18.8" height="4.8"/>
    <rect x="13.4" y="7" width="5.2" height="18"/>
  </g>
</svg>
